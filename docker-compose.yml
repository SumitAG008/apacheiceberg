version: '3.8'

services:
  db:
    # Pinned, not `:latest` — `latest` silently moved to a Postgres-18 base
    # with an incompatible data directory layout (`/var/lib/postgresql`
    # instead of `/var/lib/postgresql/data`), which crash-loops this
    # container against the `pgdata` volume below. Pin to a known-good
    # PG16 release so `docker compose up` stays reproducible.
    image: apache/age:release_PG16_1.6.0
    container_name: iceberg_graph_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: graphdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lakemind_web
    restart: always
    ports:
      - "8501:8501"
    environment:
      - GRAPH_DB_HOST=db
      - GRAPH_DB_PORT=5432
      - GRAPH_DB_USER=postgres
      - GRAPH_DB_PASSWORD=password123
      - GRAPH_DB_NAME=graphdb
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_WAREHOUSE_URI=${S3_WAREHOUSE_URI}
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  pgdata:
