name: Claude Code Review

# Automatic review of every PR against the Code Checker rubric (.claude/agents/code-checker.md),
# plus @claude mentions in PR/issue comments.
# Requires repository secret ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) and the Claude GitHub App.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    name: Claude review (code-checker rubric)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Report missing credentials
        if: env.HAS_CLAUDE_AUTH != 'true'
        run: echo "::warning::Claude review skipped — add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN in repo Settings → Secrets → Actions."

      - uses: actions/checkout@v4
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the Code Checker. Follow the rubric in .claude/agents/code-checker.md exactly
            and the ground rules in docs/governance/README.md.

            Review only this PR's diff (`gh pr diff ${{ github.event.pull_request.number }}`).
            - Post each concrete defect as an inline comment on the exact line, with severity,
              the failure scenario, and a suggested fix.
            - Then post ONE summary comment: verdict PASS / PASS WITH NOTES / BLOCK, findings table,
              and any external claims in the diff that are not ✅ in docs/governance/CLAIMS_REGISTER.md.
            - Do not comment on style unless it hides a bug. Do not praise. If nothing is wrong, say PASS.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  mention:
    name: Respond to @claude
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
