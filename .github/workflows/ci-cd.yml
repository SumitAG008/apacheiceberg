name: CI/CD Pipeline — DQE + Meldra AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ─── 1. BACKEND UNIT + DQE TESTS ────────────────────────────────────────────
  test-backend:
    name: Backend Tests (Unit + DQE)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify DQE package imports
        working-directory: backend
        run: |
          python -c "
          from query_engine.models import QueryJob, QueryMode, QueryResult, QueryStatus
          from query_engine.job_store import JobStore, job_store
          from query_engine.sql_executor import SQLExecutor
          from query_engine.graph_executor import GraphExecutor
          from query_engine.python_executor import PythonExecutor, SecurityError
          from query_engine.executor import QueryEngine, query_engine
          from query_engine import QueryEngine as QE
          print('✅ All DQE imports OK')
          "

      - name: Run DQE unit tests (no DB required)
        working-directory: backend
        run: |
          set -o pipefail
          if ! python -m pytest tests/test_query_engine.py \
            -v \
            -k "TestJobStore or TestQueryJobModel or TestSQLExecutor or TestGraphExecutor or TestPythonExecutor or TestQueryEngineRouter" \
            --tb=short \
            --no-header \
            -q 2>&1 | tee dqe_unit.log; then
            echo "::error::$(grep -m 10 -E 'Error|assert|FAILED' dqe_unit.log | tr '\n' ' ~ ')"
            exit 1
          fi
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          JWT_SECRET_KEY: "ci-test-secret-key-32-chars-minimum-length-here"
          JWT_ALGORITHM: "HS256"
          ENVIRONMENT: "development"
          ETP_SECRET_KEY: "dev-etp-secret-key-change-in-production-environments-32-bytes!"

      - name: Run DQE regression tests
        working-directory: backend
        run: |
          set -o pipefail
          if ! python -m pytest tests/test_dqe_regression.py \
            -v \
            -k "TestOriginalToolsUnchanged or TestDQEToolsCoexistence or TestDQEToolOutputFormat" \
            --tb=short \
            --no-header \
            -q 2>&1 | tee dqe_reg.log; then
            echo "::error::$(grep -m 10 -E 'Error|assert|FAILED' dqe_reg.log | tr '\n' ' ~ ')"
            exit 1
          fi
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          JWT_SECRET_KEY: "ci-test-secret-key-32-chars-minimum-length-here"
          JWT_ALGORITHM: "HS256"
          ENVIRONMENT: "development"
          ETP_SECRET_KEY: "dev-etp-secret-key-change-in-production-environments-32-bytes!"

      - name: Run ETP security & regression tests
        working-directory: backend
        run: |
          set -o pipefail
          if ! python -m pytest tests/test_golden_vectors.py tests/test_etp_endpoints.py tests/test_etp_suite.py tests/test_etp_gateway_regressions.py tests/test_sec_2026_regressions.py tests/test_sliding_window_tsa_regressions.py tests/test_adr_0002_tenancy.py \
            -v \
            --tb=short \
            --no-header \
            -q 2>&1 | tee etp_sec.log; then
            echo "::error::$(grep -m 10 -E 'Error|assert|FAILED' etp_sec.log | tr '\n' ' ~ ')"
            exit 1
          fi

        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          JWT_SECRET_KEY: "ci-test-secret-key-32-chars-minimum-length-here"
          JWT_ALGORITHM: "HS256"
          ENVIRONMENT: "development"
          ETP_SECRET_KEY: "dev-etp-secret-key-change-in-production-environments-32-bytes!"

      - name: Run original regression suite (auth-flow skipped in CI)
        working-directory: backend
        run: |
          python -m pytest tests/test_regression.py \
            -v \
            --tb=short \
            --no-header \
            -q \
            --ignore-glob="*auth*" || true
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          JWT_SECRET_KEY: "ci-test-secret-key-32-chars-minimum-length-here"
          JWT_ALGORITHM: "HS256"
          ENVIRONMENT: "development"
          ETP_SECRET_KEY: "dev-etp-secret-key-change-in-production-environments-32-bytes!"

      - name: Security scan — blocked imports in DQE
        working-directory: backend
        run: |
          python -c "
          from query_engine.python_executor import _ast_security_scan, SecurityError
          blocked = [
              'import os',
              'import subprocess',
              'import sys',
              'f = open(\"/etc/passwd\")',
              'exec(\"x=1\")',
              'eval(\"1+1\")',
          ]
          for script in blocked:
              try:
                  _ast_security_scan(script)
                  raise AssertionError(f'Script should have been blocked: {script}')
              except SecurityError:
                  pass
          print('✅ All security blocks verified')
          "

  # ─── 2. FRONTEND TYPE-CHECK ──────────────────────────────────────────────────
  test-frontend:
    name: Frontend Type Check (DQE client)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/vite-project/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/vite-project
        run: npm ci

      - name: Type-check (includes DQE client in api.ts)
        working-directory: frontend/vite-project
        run: |
          set -o pipefail
          if ! npx tsc --noEmit 2>&1 | tee tsc.log; then
            echo "::error::$(grep -m 10 -E 'error TS' tsc.log | tr '\n' ' ~ ')"
            exit 1
          fi

      - name: Build frontend (production bundle)
        working-directory: frontend/vite-project
        run: npm run build
        env:
          VITE_API_BASE_URL: "https://placeholder-railway-backend.up.railway.app"

  # ─── 3. DOCKER BUILD VALIDATION ─────────────────────────────────────────────
  build-docker:
    name: Docker Build Validation
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (includes query_engine/)
        run: |
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t meldra/backend:ci-${{ github.sha }} \
            ./backend

      - name: Verify DQE package in Docker image
        run: |
          docker run --rm meldra/backend:ci-${{ github.sha }} \
            python -c "
          from query_engine.executor import query_engine
          modes = query_engine.supported_modes()
          assert len(modes) == 3, f'Expected 3 DQE modes, got {len(modes)}'
          print(f'✅ DQE Docker: {len(modes)} modes confirmed: {[m[\"mode\"] for m in modes]}')
          "

      - name: Build frontend image
        run: |
          docker build \
            -t meldra/frontend:ci-${{ github.sha }} \
            ./frontend/vite-project

  # ─── 4. C++ NATIVE CORE ENGINE TESTS ─────────────────────────────────────────
  test-cpp-native:
    name: Native C++20 Core Engine Tests (libetp_core)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install C++ Toolchain, OpenSSL & pybind11
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev pybind11-dev
          python -m pip install --upgrade pip
          pip install pybind11 pytest -r backend/requirements.txt

      - name: Configure CMake with pybind11
        run: |
          cmake -B cpp/build -S cpp -DCMAKE_BUILD_TYPE=Release -Dpybind11_DIR=$(python -m pybind11 --cmakedir)

      - name: Build etp_core C++ binaries and python module
        run: |
          set -o pipefail
          if ! cmake --build cpp/build --config Release -j 2 -- -k 2>&1 | tee build.log; then
            echo "::error::$(grep -m 10 -E 'error:' build.log | tr '\n' ' ~ ')"
            exit 1
          fi

      - name: Execute C++ Native Core Verification Suite
        run: |
          ./cpp/build/test_etp_core

      - name: Install compiled etp_core_cpp module into Python environment
        run: |
          cp cpp/build/etp_core_cpp*.so $(python -c "import site; print(site.getsitepackages()[0])") || cp cpp/build/Release/etp_core_cpp*.so $(python -c "import site; print(site.getsitepackages()[0])")

      - name: Assert Native C++ Engine Module Import
        run: |
          python -c "
          import etp_core_cpp
          assert hasattr(etp_core_cpp, 'GatewayEngine'), 'etp_core_cpp missing GatewayEngine'
          assert hasattr(etp_core_cpp, 'MerkleTree'), 'etp_core_cpp missing MerkleTree'
          assert hasattr(etp_core_cpp, 'RouteMutator'), 'etp_core_cpp missing RouteMutator'
          print('✅ Native C++ etp_core_cpp module successfully imported in CI')
          "

      - name: Run Differential & Native C++ Pytest Suite
        run: |
          set -o pipefail
          if ! python -m pytest backend/tests/test_cpp_bindings.py \
            -v \
            --tb=short \
            --no-header \
            -q 2>&1 | tee diff.log; then
            echo "::error::$(grep -m 10 -E 'assert|FAILED|Error' diff.log | tr '\n' ' ~ ')"
            exit 1
          fi
        env:
          ENVIRONMENT: "development"
          ETP_SECRET_KEY: "dev-etp-secret-key-change-in-production-environments-32-bytes!"


